name: "penjelasan_dan_cerita"
title: "Penjelasan & Cerita"
description: "Write video scripts per segment in two modes sharing one gate: Mode PENJELAS (nonfiction explainers built on a fact sheet, a promise ledger, the P1–P9 explanation rules and a failure-modes checklist) and Mode CERITA (compressed fiction built with a premise workshop, therefore/but causality, try-fail and scene-sequel beats, and a setup registry). Duration is a project parameter (see PIPELINE.md in this repo), never a property of the skill: word counts, arc proportions and checker thresholds are stated as functions of the project's target duration. Both modes must pass a reader-sim run by an agent separate from the writer plus a clean promise ledger before the script may pass the gate. Use for script writing and script gate work inside the pipeline in this repo."
category: "Work and knowledge"
include_in_prompt: false
