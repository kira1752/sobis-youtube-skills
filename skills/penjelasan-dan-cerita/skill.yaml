name: "penjelasan_dan_cerita"
title: "Penjelasan & Cerita"
description: "Write ±60-second Shorts scripts in two modes sharing one gate: Mode PENJELAS (nonfiction explainers built on a fact sheet, a promise ledger, the P1–P9 explanation rules and a failure-modes checklist) and Mode CERITA (compressed micro-fiction built with a premise workshop, therefore/but causality, try-fail and scene-sequel beats, and a setup registry). Both modes must pass a reader-sim run by an agent separate from the writer plus a clean promise ledger before the script may pass the gate. Use for YouTube division script writing and script gate work."
category: "Work and knowledge"
