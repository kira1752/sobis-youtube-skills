name: "video_suara_bawaan"
title: "Generate Video Bawaan Muse — Mesin Generate Utama Pipa Produksi Video"
description: "The primary video-generation engine of the production pipeline defined in PIPELINE.md (repo root): generate video directly with Muse's own built-in generative model — native-dialogue clips of about 10 seconds each (a fixed tool limit, not a video-length limit), chained across clips via snapshot_id and stitched into full videos of any target duration at the packaging stage. Orientation is a project format parameter: the skill carries a tested explicit vertical-portrait prompt phrase, and its audit checks orientation against the format the project chose (landscape is not a failure for a landscape project). Includes the full chain map with hand-off conditions between stages, key anti-slop rules restated from the sibling script and packaging skills, pre-generation AI-slop prevention (no in-frame text, single speaker) and a mandatory frame-by-frame audit gate before any result is shown to the channel owner. Built-in TTS narration is a supporting path only, subject to the pipeline's voice-licensing rule before broadcast. External video/voice engines are fallback, opened only when the built-in path provably fails a gate."
category: "Work and knowledge"
include_in_prompt: false
